<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Scanner & Analysis Report</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        /* --- General Reset ---- */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { display: flex; height: 100vh; background-color: #fcfcfc; overflow: hidden; }

        /* --- Sidebar --- */
        .sidebar { width: 250px; background-color: #f2c96c; display: flex; flex-direction: column; padding-top: 30px; gap: 20px; flex-shrink: 0; align-items: center; }
        .logo-container { width: 100%; padding: 0 10px 10px 10px; display: flex; justify-content: center; margin-top: -10px; }
        .logo-container img { width: 80%; height: auto; border-radius: 100px; object-fit: contain; }
        .nav-item { background: white; margin-right: -25px; padding: 15px 30px; border-radius: 0 30px 30px 0; display: flex; align-items: center; gap: 15px; cursor: pointer; box-shadow: 2px 2px 10px rgba(0,0,0,0.05); transition: 0.3s; width: 90%; align-self: flex-start; }
        .nav-item:hover { transform: translateX(5px); background: #fff9ed; }

        /* --- Main Content --- */
        .main-content { flex: 1; position: relative; display: flex; flex-direction: column; padding: 20px 40px; overflow-y: auto; }
        .top-bar { width: 100%; display: flex; justify-content: flex-end; margin-bottom: 40px; }
        .share-btn { background-color: #000; color: white; padding: 8px 20px; border-radius: 8px; border: none; display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }

        /* --- Search Section --- */
        .scan-container { width: 100%; max-width: 900px; margin: 0 auto 50px auto; text-align: center; }
        .input-wrapper { position: relative; margin-bottom: 20px; }
        .input-wrapper input { width: 100%; padding: 15px 15px 15px 50px; border: 1.5px solid #000; border-radius: 8px; font-size: 16px; outline: none; }
        .input-wrapper .search-icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; stroke: #555; stroke-width: 2; fill: none; }

        .start-scan-btn { background-color: #f2c96c; border: none; padding: 12px 35px; border-radius: 10px; font-weight: 600; display: inline-flex; align-items: center; gap: 10px; cursor: pointer; transition: 0.2s; }
        .start-scan-btn:hover { background-color: #e0b85a; }

        /* --- Report Table --- */
        .report-section { width: 100%; max-width: 1100px; margin: 0 auto; background: white; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); border: 1px solid #eee; overflow: hidden; }
        .report-header { background-color: #000; color: white; padding: 15px 25px; font-size: 1.2rem; font-weight: 600; display: flex; align-items: center; gap: 10px; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background-color: #f8f9fa; color: #555; font-weight: 600; padding: 15px 20px; border-bottom: 2px solid #eee; font-size: 0.9rem; text-transform: uppercase; }
        td { padding: 15px 20px; border-bottom: 1px solid #eee; font-size: 0.9rem; color: #333; vertical-align: middle; }
        tr:hover { background-color: #fffdf7; }
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; }
        .high { background: #ffebee; color: #c62828; }
        .medium { background: #fff3e0; color: #ef6c00; }
        .low { background: #e8f5e9; color: #2e7d32; }
        .icon { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; }
        .loading { display: none; font-size: 14px; color: #555; margin-bottom: 10px; }
    </style>
</head>
<body>

<aside class="sidebar">
    <div class="logo-container">
        <img src="{{ url_for('static', filename='Detect.jpg') }}" alt="Detect Logo">
    </div>
    <div class="nav-item">New Chat</div>
    <div class="nav-item">Search Chat</div>
</aside>

<main class="main-content">
    <div class="top-bar">
        <button class="share-btn">Share</button>
    </div>

    <section class="scan-container">
        <div class="input-wrapper">
            <!-- Search Icon SVG -->
            <svg class="search-icon" viewBox="0 0 24 24">
                <circle cx="11" cy="11" r="7"></circle>
                <line x1="16" y1="16" x2="22" y2="22"></line>
            </svg>
            <input type="text" id="url-input" placeholder="https://example.com/analysis">
        </div>
        <button class="start-scan-btn" onclick="startScan()">Start Scanning</button>
        <div class="loading" id="loading-text">Scanning URL, please wait...</div>
    </section>

    <section class="report-section">
        <div class="report-header">Scan Analysis Report</div>
        <table id="report-table">
            <thead>
                <tr>
                    <th>Issue Found</th>
                    <th>Severity Level</th>
                    <th>Provide Solution</th>
                    <th>Improvement After Fix</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </section>
</main>

<script>
async function startScan() {
    const url = document.getElementById("url-input").value;
    if (!url) {
        alert("Please enter a URL!");
        return;
    }

    const loading = document.getElementById("loading-text");
    loading.style.display = "block";

    try {
        const response = await fetch("/scan", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ url })
        });

        if (!response.ok) throw new Error("Network response was not ok");

        const data = await response.json();

        const tbody = document.querySelector("#report-table tbody");
        tbody.innerHTML = ""; // clear previous results

        data.forEach(item => {
            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td>${item.issue}</td>
                <td><span class="badge ${item.severity}">${item.severity}</span></td>
                <td>${item.solution}</td>
                <td>${item.improvement}</td>
            `;
            tbody.appendChild(tr);
        });
    } catch (error) {
        alert("Error scanning URL: " + error.message);
    } finally {
        loading.style.display = "none";
    }
}
</script>

</body>
</html>
