<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BugScout | URL Scanner</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { display: flex; height: 100vh; background-color: #f8f9fa; overflow: hidden;}

        /* Sidebar Styling */
        .sidebar { 
            width: 280px; 
            background-color: #f2c96c; 
            display: flex; 
            flex-direction: column; 
            padding-top: 30px; 
            gap: 10px; 
            align-items: center; 
            position: relative; 
            box-shadow: 4px 0 15px rgba(0,0,0,0.1);
            z-index: 10;
        }
        
        /* Proper Circular Logo */
        .logo-container { width: 100%; display: flex; flex-direction: column; align-items: center; margin-bottom: 20px;}
        .logo-circle img { width: 100%; height: 60%; object-fit: cover; }
        .brand-name { 
            margin-top: 12px; 
            font-weight: 700; 
            font-size: 1.4rem; 
            color: #000; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
        }

        /* Navigation buttons */
        .nav-group { width: 100%; display: flex;margin-top: -70px; flex-direction: column; gap: 12px; }
        .nav-item { 
            background: white; 
            padding: 14px 25px; 
            border-radius: 0 40px 40px 0; 
            cursor: pointer; 
            box-shadow: 3px 3px 10px rgba(0,0,0,0.05); 
            width: 90%; 
            align-self: flex-start; 
            transition: all 0.3s ease; 
            font-weight: 600; 
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .nav-item:hover { transform: translateX(8px); background: #000; color: #f2c96c; }

        /* Search panel UI */
        #search-panel {
            display: none; width: 90%; padding: 20px; background: white; border-radius: 15px;
            flex-direction: column; gap: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            margin-top: 10px; border: 1px solid rgba(0,0,0,0.1);
        }
        #search-panel input { 
            width: 100%; padding: 12px; border: 2px solid #eee; border-radius: 8px; 
            outline: none; transition: 0.3s;
        }
        #search-panel input:focus { border-color: #f2c96c; }
        #history-list { max-height: 250px; overflow-y: auto; list-style: none; margin-top: 10px;}
        .history-item { 
            padding: 10px 12px; border-radius: 6px; margin-bottom: 5px;
            font-size: 0.85rem; cursor: pointer; color: #444; 
            transition: 0.2s; border-left: 3px solid transparent;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .history-item:hover { background: #fff9ed; border-left-color: #f2c96c; color: #000; }
        #close-btn { cursor: pointer; align-self: flex-end; font-size: 18px; font-weight: bold; color: #999; }
        #close-btn:hover { color: #000; }

        /* Main Content */
        .main-content { flex: 1; padding: 40px; overflow-y: auto; display: flex; flex-direction: column; align-items: center;}
        .scan-container { width: 100%; max-width: 850px; text-align: center; margin-bottom: 40px; }
        .main-title { font-size: 2rem; font-weight: 700; color: #222; margin-bottom: 30px; }
        
        .input-group { 
            display: flex; gap: 10px; width: 100%; background: white; 
            padding: 8px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            border: 2px solid #000;
        }
        .input-group input { 
            flex: 1; padding: 15px 20px; border: none; font-size: 1.1rem; outline: none; border-radius: 10px;
        }
        .start-scan-btn { 
            background: #f2c96c; padding: 15px 40px; border: none; 
            border-radius: 10px; cursor: pointer; font-weight: 700; 
            font-size: 1rem; transition: 0.3s; color: #000;
        }
        .start-scan-btn:hover { background: #000; color: #f2c96c; transform: translateY(-2px); }

        .loading { display: none; font-size: 0.9rem; color: #666; margin-top: 20px; font-weight: 500; }
        
        /* Report Table Styling */
        .report-section { 
            width: 100%; max-width: 1100px; background: white; border-radius: 20px; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.04); overflow: hidden; border: 1px solid #eee;
        }
        table { width: 100%; border-collapse: collapse; }
        th { background: #fafafa; padding: 20px; text-align: left; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; color: #888; border-bottom: 2px solid #f4f4f4; }
        td { padding: 20px; border-bottom: 1px solid #f9f9f9; font-size: 0.95rem; color: #333; }
        
        .badge { padding: 6px 14px; border-radius: 10px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; }
        .high { background: #ffebee; color: #d32f2f; }
        .medium { background: #fff3e0; color: #ef6c00; }
        .low { background: #e8f5e9; color: #2e7d32; }
    </style>
</head>
<body>

<aside class="sidebar">
    <div class="logo-container">
        <div class="logo-circle">
            <img src="{{ url_for('static', filename='Detect.png') }}" alt="BugScout Logo">
        </div>
    </div>

    <div class="nav-group">
        <div class="nav-item" onclick="newChat()"><span>+</span> New Scan</div>
        <div class="nav-item" onclick="openSearch()"><span>🔍</span> History Search</div>
    </div>

    <div id="search-panel">
        <div id="close-btn" onclick="closeSearch()">✖</div>
        <input type="text" id="search-input" placeholder="Find past scans..." onkeyup="filterHistory()">
        <ul id="history-list">
            </ul>
    </div>
</aside>

<main class="main-content">
    <section class="scan-container">
        <h1 class="main-title">URL Security Scout</h1>
        <div class="input-group">
            <input type="text" id="url-input" placeholder="Enter target URL (e.g. https://google.com)">
            <button class="start-scan-btn" onclick="startScan()">Analyze</button>
        </div>
        <div class="loading" id="loading-text">🚀 Scout is analyzing the target...</div>
    </section>

    <section class="report-section">
        <table id="report-table">
            <thead>
                <tr>
                    <th>Detected Vulnerability</th>
                    <th>Risk Level</th>
                    <th>Remediation</th>
                    <th>Security Growth</th>
                </tr>
            </thead>
            <tbody>
                </tbody>
        </table>
    </section>
</main>

<script>
let scanHistory = [];

async function startScan() {
    const url = document.getElementById("url-input").value.trim();
    if (!url) return;

    document.getElementById("loading-text").style.display = "block";
    const tbody = document.querySelector("#report-table tbody");

    try {
        const res = await fetch("/scan", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ url })
        });
        const data = await res.json();

        // Save to local history state
        if (!scanHistory.find(item => item.url === url)) {
            scanHistory.push({ url: url, data: data });
            updateHistoryUI();
        }

        displayResults(data);

    } catch (e) { 
        console.error("Scan Error:", e);
        alert("Failed to reach scanner server.");
    } finally { 
        document.getElementById("loading-text").style.display = "none"; 
    }
}

function displayResults(data) {
    const tbody = document.querySelector("#report-table tbody");
    tbody.innerHTML = "";
    
    if(data.length === 0) {
        tbody.innerHTML = "<tr><td colspan='4' style='text-align:center; padding:40px; color:#999;'>No issues detected for this URL.</td></tr>";
        return;
    }

    data.forEach(i => {
        tbody.innerHTML += `
            <tr>
                <td style="font-weight:600;">${i.issue}</td>
                <td><span class="badge ${i.severity.toLowerCase()}">${i.severity}</span></td>
                <td>${i.solution}</td>
                <td>${i.improvement}</td>
            </tr>`;
    });
}

function updateHistoryUI() {
    const list = document.getElementById("history-list");
    list.innerHTML = "";
    scanHistory.forEach((item, index) => {
        const li = document.createElement("li");
        li.className = "history-item";
        li.textContent = item.url;
        li.title = item.url;
        li.onclick = () => loadFromHistory(index);
        list.appendChild(li);
    });
}

function loadFromHistory(index) {
    const selected = scanHistory[index];
    document.getElementById("url-input").value = selected.url;
    displayResults(selected.data);
    closeSearch();
}

function filterHistory() {
    const val = document.getElementById("search-input").value.toLowerCase();
    const items = document.querySelectorAll(".history-item");
    items.forEach(item => {
        item.style.display = item.textContent.toLowerCase().includes(val) ? "block" : "none";
    });
}

function newChat() {
    document.getElementById("url-input").value = "";
    document.querySelector("#report-table tbody").innerHTML = "";
    closeSearch();
}

function openSearch() {
    const panel = document.getElementById("search-panel");
    panel.style.display = panel.style.display === "flex" ? "none" : "flex";
}

function closeSearch() {
    document.getElementById("search-panel").style.display = "none";
}
</script>

</body>
</html>
